name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: |
          node -e "const {version} = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); if ('v' + version !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + version); process.exit(1); }"
      - run: npm run coverage
      - name: Read the release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
